name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download embedding model (build-time, not committed)
        run: npm run fetch-model

      - name: Build worker bundle
        run: npm run build:worker

      - name: Build (generates .next/types for full type check)
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Clustering eval (ARI / purity / silhouette / triage)
        run: npm run eval
